name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@osl/event-forge"
        - "@osl/flagship"
        - "@osl/loglens"
        - repository/docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, command, or documentation change you have in mind.
    validations:
      required: true
